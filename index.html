.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

.pill.ok { color: var(--good); background: var(--good-soft); } .pill.warn { color: var(--warn); background: var(--warn-soft); } .pill.crit { color: var(--crit); background: var(--crit-soft); } .pill.acc { color: var(--accent); background: var(--accent-soft); }

.step:last-child::before { display: none; }

.step.done i { border-color: var(--good); background: var(--good); color: #fff; }
.step.now i { border-color: var(--accent); color: var(--accent); }
.step .t { font-weight: 600; font-size: 13px; } .step .s { font-size: 12px; color: var(--muted); }

.action { border: 2px solid var(--accent); }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }

.field input[type="text"], .field input[type="datetime-local"], .field select, .field textarea { border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.err { color: var(--crit); font-size: 12.5px; margin: 4px 0 8px; }
.pin { display: flex; gap: 8px; align-items: center; margin-top: 10px; }

.job { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--sunken); }

.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

  nav.side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding-block: 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }

@media print {
  @page { size: A4; margin: 14mm; }

  body * { visibility: hidden; }

  .report, .report * { visibility: visible; color: #000 !important; }

  .report .sigbox { border-color: #888; break-inside: avoid; }

  .report section { break-inside: avoid; }
}

      <div class="field"><span class="label">Priority</span><div class="chips" id="pr"><button type="button" data-v="Class 1" aria-pressed="false">Class 1 (urgent)</button><button type="button" data-v="Class 2" aria-pressed="true">Class 2 (normal)</button></div></div>
      <label class="check"><input type="checkbox" id="sd"> Job needs a plant / unit shutdown</label>
      <div class="field"><label for="rep">Engineer's report</label><textarea id="rep" placeholder="Findings, probable cause, what maintenance should prepare"></textarea></div>
      <div class="field"><label for="tct">Tentative completion time (hours)</label><input type="text" id="tct" inputmode="decimal" placeholder="e.g. 4"></div>
      ${signBlock()}<button class="btn" id="do">Submit report and sign</button>`;
    after = () => {
      const pick = (id, key, multi) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { if (multi) { const i = draft.sectors.indexOf(b.dataset.v); i < 0 ? draft.sectors.push(b.dataset.v) : draft.sectors.splice(i, 1); b.setAttribute('aria-pressed', i < 0); } else { draft[key] = b.dataset.v; $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); } });
      pick('#secs', 'sectors', true); pick('#cls', 'cls'); pick('#pr', 'pr');
      $('#do').onclick = () => {
        const e = $('#aerr'); if (!draft.sectors.length) { e.textContent = 'Select at least one sector.'; e.hidden = false; return; }
        if ($('#rep').value.trim().length < 5) { e.textContent = 'Write the engineer\'s report.'; e.hidden = false; return; } if (!pinOk()) return;
        o.sectors = [...draft.sectors]; o.jobs = o.sectors.map(s => ({ sector: s, engineer: null, actions: '', parts: '', started: null, finishedSig: null, approvedSig: null }));
        o.safetyClass = draft.cls; o.priority = draft.pr; o.shutdown = $('#sd').checked; o.est = $('#tct').value ? $('#tct').value + ' hrs' : ''; o.rejected = null;
        o.notes.push({ by: me, text: 'Report: ' + $('#rep').value.trim() }); sign(o, 'Report submitted'); o.status = 'classified';
        if (o.priority === 'Class 1' && p) p.status = 'Offline';
        toast(`Report submitted and signed. Ticket waits for Process Supervisor approval.`); rOrder(o.no);
      };
    };
  } else if (S === 'classified') {
    html = `<div class="field"><label for="nt">Notes to the engineer's report (optional)</label><textarea id="nt"></textarea></div>${signBlock()}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good" id="do">Approve and sign</button><button class="btn danger" id="rej">Reject</button></div>`;
    after = () => {
      $('#do').onclick = () => { if (!pinOk()) return; const n = $('#nt').value.trim(); if (n) o.notes.push({ by: me, text: n }); sign(o, 'Report approved'); o.status = 'open'; toast('Ticket opened and sent to the Maintenance Manager.'); rOrder(o.no); };
      $('#rej').onclick = () => { const n = $('#nt').value.trim(); if (!n) { $('#aerr').textContent = 'Write the reason in the notes before rejecting.'; $('#aerr').hidden = false; return; } o.rejected = { by: me, text: n }; o.status = 'reported'; toast('Returned to the Process Engineer.'); rOrder(o.no); };
    };
  } else if (S === 'open' || S === 'held') {
    const dflt = new Date(Date.now() + 18 * H); dflt.setMinutes(0);
    html = `${S === 'held' ? '<p class="muted" style="margin:0 0 10px">This job is on the shutdown list. Set an appointment when the shutdown is planned.</p>' : ''}
      <div class="field"><label for="apt">Maintenance appointment</label><input type="datetime-local" id="apt" value="${new Date(dflt - dflt.getTimezoneOffset() * 60000).toISOString().slice(0, 16)}"></div>
      <div class="field"><label for="nt">Notes (re-identification, reason for rejection)</label><textarea id="nt"></textarea></div>${signBlock()}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good" id="do">Approve, set appointment, sign</button>${S === 'open' && o.shutdown ? '<button class="btn ghost" id="hold">Approve and hold for shutdown</button>' : ''}${S === 'open' ? '<button class="btn danger" id="rej">Reject</button>' : ''}</div>`;
    after = () => {
      $('#do').onclick = () => { if (!pinOk()) return; o.appointment = new Date($('#apt').value).getTime() || Date.now() + 18 * H; const n = $('#nt').value.trim(); if (n) o.notes.push({ by: me, text: n }); sign(o, 'Ticket approved, appointment set'); o.status = 'scheduled'; toast(`Appointment set. Process${o.safetyClass === 'II' ? ', Electrical and Safety' : ' and Electrical'} notified; sector managers asked to assign engineers.`); rOrder(o.no); };
      if ($('#hold')) $('#hold').onclick = () => { if (!pinOk()) return; sign(o, 'Approved, held for shutdown'); o.status = 'held'; toast('Added to the shutdown list.'); rOrder(o.no); };
      if ($('#rej')) $('#rej').onclick = () => { const n = $('#nt').value.trim(); if (!n) { $('#aerr').textContent = 'Write the reason before rejecting.'; $('#aerr').hidden = false; return; } o.rejected = { by: me, text: n }; o.status = 'classified'; toast('Returned to Process for re-identification.'); rOrder(o.no); };
    };
  } else if (S === 'scheduled') {
    const jobs = o.jobs.filter(j => !j.engineer && (full() || MGR[j.sector] === me));
    html = jobs.map((j, i) => `<div class="field"><label for="as${i}">${j.sector} engineer</label><select id="as${i}" data-sector="${j.sector}">${USERS.filter(u => u.sector === j.sector && /Engineer/.test(u.pos)).map(u => `<option value="${u.id}">${u.name}</option>`).join('')}</select></div>`).join('') + signBlock() + `<button class="btn" id="do">Assign and sign</button>`;
    after = () => { $('#do').onclick = () => { if (!pinOk()) return; jobs.forEach((j, i) => { j.engineer = $('#as' + i).value; sign(o, `Assigned ${U(j.engineer).name}`); }); if (o.jobs.every(j => j.engineer)) o.status = 'assigned'; toast('Engineers assigned and notified. Isolation signatures now required.'); rOrder(o.no); }; };
  } else if (S === 'assigned') {
    const which = !o.isolation.process && (full() || me === 'proc_eng') ? 'process' : !o.isolation.electrical && (full() || me === 'elec_mgr') ? 'electrical' : 'safety';
    const lab = { process: 'Process isolation done', electrical: 'Electrical isolation done, tags provided', safety: 'Safety clearance given' }[which];
    html = `<p class="muted" style="margin:0 0 10px">Appointment ${o.appointment ? fmt(o.appointment) : ''}. ${which === 'safety' ? 'Class II: Safety Department confirms gas test, PPE and precautions.' : 'Confirm on site, then sign.'}</p>
      ${which === 'electrical' ? '<label class="check"><input type="checkbox" id="c1"> Electrical isolation: done</label><label class="check"><input type="checkbox" id="c2"> Tags provided and applied (LOTO)</label>' : which === 'process' ? '<label class="check"><input type="checkbox" id="c1"> Process isolation: done (valves closed, line drained)</label>' : '<div class="field"><label for="sn">Safety comments</label><textarea id="sn" placeholder="Gas test result, PPE, precautions"></textarea></div>'}
      ${signBlock()}<button class="btn" id="do">Sign ${which} ${which === 'safety' ? 'clearance' : 'isolation'}</button>`;
    after = () => { $('#do').onclick = () => { if (which !== 'safety' && !($('#c1').checked && (!$('#c2') || $('#c2').checked))) { $('#aerr').textContent = 'Tick the isolation confirmation first.'; $('#aerr').hidden = false; return; } if (!pinOk()) return;
      o.isolation[which] = sig(me, Date.now(), lab); if (which === 'safety') o.safetyNote = $('#sn').value.trim();
      const done = o.isolation.process && o.isolation.electrical && (o.safetyClass !== 'II' || o.isolation.safety);
      if (done) { o.status = 'isolated'; if (p) p.status = 'Isolated'; toast(`All isolation signatures in. ${o.tag} is now Isolated; engineers may start.`); } else toast('Signature recorded. Waiting for the other isolation signatures.'); rOrder(o.no); }; };
  } else if (S === 'isolated' || S === 'in_progress') {
    const j = o.jobs.find(j => !j.finishedSig && (full() || j.engineer === me));
    if (!j.started) { html = `<p class="muted" style="margin:0 0 10px">${stag(j.sector)} job on ${o.tag}. Equipment is isolated.</p><button class="btn" id="do">Start job</button>`; after = () => { $('#do').onclick = () => { j.started = Date.now(); o.status = 'in_progress'; toast('Job started; clock running for MTTR.'); rOrder(o.no); }; }; }
    else { html = `<div class="field"><label for="ac">Actions taken</label><textarea id="ac">${esc(j.actions)}</textarea></div><div class="field"><label for="pt">Spare parts: warehouse order numbers</label><input type="text" id="pt" value="${esc(j.parts)}" placeholder="e.g. WH-2026-0412 mech seal x1"></div>
      <div class="photo"><input type="file" id="ph" accept="image/*" multiple><label for="ph">+ Add completion photos</label><span id="phc">${(j.photos || []).length} attached</span></div>
      ${o.checklist ? '<p class="muted" style="margin:8px 0 0;font-size:12px">All checklist items must be ticked before signing.</p>' : ''}${signBlock()}<button class="btn good" id="do" style="margin-top:8px">Mark job finished and sign</button>`;
      after = () => { $('#ph').onchange = e => [...e.target.files].slice(0, 4).forEach(f => { const r = new FileReader(); r.onload = () => { (j.photos = j.photos || []).push(r.result); $('#phc').textContent = j.photos.length + ' attached'; }; r.readAsDataURL(f); });
        $('#do').onclick = () => { j.actions = $('#ac').value.trim(); j.parts = $('#pt').value.trim(); if (j.actions.length < 5) { $('#aerr').textContent = 'Describe the actions taken.'; $('#aerr').hidden = false; return; } if (o.checklist && o.checklist.some(c => !c.done)) { $('#aerr').textContent = 'Tick every checklist item first.'; $('#aerr').hidden = false; return; } if (!pinOk()) return;
          j.finishedSig = sign(o, 'Job finished'); if (o.jobs.every(x => x.finishedSig)) o.status = 'finished'; toast('Job finished and signed. Sector manager asked to check.'); rOrder(o.no); }; };
    }
  } else if (S === 'finished') {
    const jobs = o.jobs.filter(j => j.finishedSig && !j.approvedSig && (full() || MGR[j.sector] === me));
    html = `<p class="muted" style="margin:0 0 10px">Check ${jobs.map(j => j.sector).join(', ')} work recorded on this order.</p><div class="field"><label for="nt">Notes</label><textarea id="nt"></textarea></div>${signBlock()}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good" id="do">Approve work and sign</button><button class="btn danger" id="rej">Send back to engineer</button></div>`;
    after = () => { $('#do').onclick = () => { if (!pinOk()) return; const n = $('#nt').value.trim(); if (n) o.notes.push({ by: me, text: n }); jobs.forEach(j => j.approvedSig = sign(o, 'Work checked')); if (o.jobs.every(j => j.approvedSig)) o.status = 'sector_approved'; toast('Work checked. Maintenance Manager asked for final approval.'); rOrder(o.no); };
      $('#rej').onclick = () => { const n = $('#nt').value.trim(); if (!n) { $('#aerr').textContent = 'Write what must be redone.'; $('#aerr').hidden = false; return; } jobs.forEach(j => { j.finishedSig = null; }); o.rejected = { by: me, text: n }; o.status = 'in_progress'; toast('Returned to the engineer.'); rOrder(o.no); }; };
  } else if (S === 'sector_approved') {
    html = `<div class="field"><label for="nt">Final comments</label><textarea id="nt"></textarea></div>${signBlock()}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn good" id="do">Final approval and sign</button><button class="btn danger" id="rej">Reject</button></div>`;
    after = () => { $('#do').onclick = () => { if (!pinOk()) return; const n = $('#nt').value.trim(); if (n) o.notes.push({ by: me, text: n }); sign(o, 'Final approval'); o.status = 'maint_approved'; toast('Sent to Process to confirm the fix.'); rOrder(o.no); };
      $('#rej').onclick = () => { const n = $('#nt').value.trim(); if (!n) { $('#aerr').textContent = 'Write the reason.'; $('#aerr').hidden = false; return; } o.jobs.forEach(j => j.approvedSig = null); o.rejected = { by: me, text: n }; o.status = 'finished'; toast('Returned to the sector managers.'); rOrder(o.no); }; };
  } else if (S === 'maint_approved') {
    html = `<label class="check"><input type="checkbox" id="c1"> Trial run conducted and equipment handed over to shift</label><div class="field" style="margin-top:8px"><label for="dt">Downtime (hours)</label><input type="text" id="dt" inputmode="decimal" value="${o.appointment ? Math.max(0.5, Math.round(((o.jobs.map(j => j.finishedSig?.at || 0).reduce((a, b) => Math.max(a, b), 0) || Date.now()) - o.appointment) / H * 2) / 2) : 1}"></div>${signBlock()}<button class="btn good" id="do">Confirm fix, sign and close</button>`;
    after = () => { $('#do').onclick = () => { if (!$('#c1').checked) { $('#aerr').textContent = 'Confirm the trial run first.'; $('#aerr').hidden = false; return; } if (!pinOk()) return; o.downtime = parseFloat($('#dt').value) || 1; sign(o, 'Fix confirmed'); o.status = 'closed'; o.closedAt = Date.now(); if (p && !ORDERS.some(x => x !== o && x.tag === o.tag && ['isolated', 'in_progress', 'finished', 'sector_approved', 'maint_approved'].includes(x.status))) p.status = 'Online'; toast(`Order #${o.no} closed. ${o.tag} back Online. Signed report available.`); rOrder(o.no); }; };
  }
  box.innerHTML = `<div class="card action"><h3>Your action: ${esc(act)} <span>${esc(ME().pos)}</span></h3>${html}</div>`;
  after();
}

/* ---------- signed report ---------- */
function showReport(o) {
  const p = byTag(o.tag); const find = re => o.sigs.filter(s => re.test(s.label));
  const sb = (t, s) => `<div class="sigbox"><small>${t}</small>${s ? `<b style="font-family:'Brush Script MT','Segoe Script',cursive;font-size:16px;color:var(--accent)">${esc(U(s.user)?.name || 'System')}</b><small>${esc(U(s.user)?.pos || '')} · ${fmt(s.at)}</small>` : '<small>—</small>'}</div>`;
  $('#modal').innerHTML = `<div class="modal" id="mod"><div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="font-size:16px">${o.status === 'closed' ? 'Signed report' : 'Order form · in progress'}</h2><div style="display:flex;gap:8px"><button class="btn sm" id="print">Print</button><button class="btn ghost sm" id="close">Close</button></div></div>
    <div class="report">
      <div class="rh"><div><b>${o.type === 'PMO' ? 'PREVENTIVE MAINTENANCE ORDER' : 'WORK ORDER'}</b><br><small class="muted">Al-Baha Company For Caustic-Chlorine Industry · Form ${o.type === 'PMO' ? 'Fsop21-21 rev a' : 'FSOP 21-2 Rev. b'} (digital)</small></div><div class="no">№ ${o.no}</div></div>
      <section><div class="dl"><dt>Date / Time</dt><dd>${fmt(o.raisedAt)}</dd><dt>Department From / To</dt><dd>Process → Maintenance (${o.sectors.join(', ')})</dd><dt>Equipment / No.</dt><dd>${esc(p ? p.name : '')} / ${o.tag}</dd><dt>Nature of job</dt><dd>${o.priority === 'Class 1' ? 'Urgent' : 'Normal'} · Safety clearance Class ${o.safetyClass}${o.shutdown ? ' · shutdown job' : ''}</dd>${o.est ? `<dt>Tentative comp. time</dt><dd>${esc(o.est)}</dd>` : ''}</div>
        <h4 style="margin-top:8px">Description of job</h4><div>${esc(o.desc)}</div>${o.notes.map(n => `<div class="muted">${esc(uname(n.by))}: ${esc(n.text)}</div>`).join('')}
        <div class="sigrow" style="margin-top:8px">${sb('Reported by', find(/Reported|raised/)[0])}${sb('Process Engineer report', find(/Report submitted|Standby/)[0])}${sb('Authorized signature (Process S.V. / Manager)', find(/Report approved/)[0])}</div></section>
      <section><h4>Category of safety clearance: Class ${o.safetyClass}</h4><div class="sigrow">${sb('Head of Electrical Department: isolation and tags', o.isolation.electrical)}${sb('Processes Department: process isolation', o.isolation.process)}${o.safetyClass === 'II' ? sb('Head of Safety Department', o.isolation.safety) : ''}</div>${o.safetyNote ? `<div class="muted">Safety comments: ${esc(o.safetyNote)}</div>` : ''}</section>
      <section><h4>Execution</h4><div class="dl"><dt>Appointment</dt><dd>${o.appointment ? fmt(o.appointment) : '—'}</dd>${o.jobs.map(j => `<dt>${j.sector}</dt><dd>${esc(U(j.engineer)?.name || '')}: ${esc(j.actions)}${j.parts ? `<br>Spare parts: ${esc(j.parts)}` : ''}</dd>`).join('')}${o.checklist ? `<dt>Checklist</dt><dd>${o.checklist.map(c => (c.done ? '☑ ' : '☐ ') + esc(c.c)).join('; ')}</dd>` : ''}</div>
        <div class="sigrow" style="margin-top:8px">${o.jobs.map(j => sb(`${j.sector} engineer: job finished`, j.finishedSig) + sb(`${j.sector} manager: work checked`, j.approvedSig)).join('')}</div></section>
      <section><h4>Completion and hand-over</h4><div class="dl"><dt>Job completed at</dt><dd>${o.jobs.map(j => j.finishedSig ? fmt(j.finishedSig.at) : '—').join(', ')}</dd><dt>Trial run and hand-over</dt><dd>${o.closedAt ? fmt(o.closedAt) : '—'} · downtime ${o.downtime ?? '—'} h</dd></div>
        <div class="sigrow" style="margin-top:8px">${sb('Signature of Maintenance Department (HOD)', find(/Final approval/)[0])}${sb('Signature of Control Room / Process in charge', find(/Fix confirmed/)[0])}</div></section>
    </div></div></div>`;
  $('#print').onclick = () => { const t = document.title; document.title = `${o.type} ${o.no} - ${o.tag}`; window.print(); document.title = t; };

/* ===================== shutdown list ===================== */
let sfSector = 'all', sfPr = 'all';
function rShutdown() {
  const held = ORDERS.filter(o => o.shutdown && o.status !== 'closed').filter(o => sfSector === 'all' || o.sectors.includes(sfSector)).filter(o => sfPr === 'all' || o.priority === sfPr);
  const units = [...new Set(held.map(o => byTag(o.tag)?.unit || 'Other'))];
  $('#view').innerHTML = `<div class="toolbar"><select id="ss"><option value="all">All sectors</option>${SECTORS.map(s => `<option>${s}</option>`).join('')}</select><select id="sp"><option value="all">All priorities</option><option>Class 1</option><option>Class 2</option></select><span class="sp"></span><span class="muted">${held.length} jobs waiting for a shutdown</span><button class="btn ghost sm" id="exp">Copy as CSV</button></div>
    <p class="muted" style="margin:0 0 10px">Live list of approved jobs that need the plant or unit stopped, grouped by unit as in the current Excel sheet. Jobs leave the list when the Maintenance Manager sets their appointment.</p>
    ${units.map(u => `<div class="group-h"><span>${esc(u)}</span><span class="muted">${held.filter(o => (byTag(o.tag)?.unit || 'Other') === u).length}</span></div><div class="tablew"><table><thead><tr><th>S.N</th><th>Order</th><th>Equipment</th><th>Job</th><th>Sector</th><th>Priority</th><th>Est.</th><th>Status</th></tr></thead><tbody>${held.filter(o => (byTag(o.tag)?.unit || 'Other') === u).map((o, i) => `<tr class="click" data-no="${o.no}"><td class="num">${i + 1}</td><td class="mono">${o.type} ${o.no}</td><td><b>${esc(byTag(o.tag)?.name || '')}</b><br><span class="mono muted">${o.tag}</span></td><td style="max-width:360px">${esc(o.desc)}</td><td>${o.sectors.map(stag).join(' ')}</td><td class="num">${o.priority.replace('Class ', '')}</td><td>${o.est || '—'}</td><td>${o.status === 'held' ? '<span class="pill">not done</span>' : pill(o.status)}</td></tr>`).join('')}</tbody></table></div>`).join('') || '<p class="empty">No jobs are waiting for a shutdown.</p>'}`;
  $('#ss').value = sfSector; $('#sp').value = sfPr; $('#ss').onchange = e => { sfSector = e.target.value; rShutdown(); }; $('#sp').onchange = e => { sfPr = e.target.value; rShutdown(); };
  $('#view').querySelectorAll('tr[data-no]').forEach(r => r.addEventListener('click', () => go('orders', +r.dataset.no)));
  $('#exp').onclick = () => { const csv = ['Unit,Order,Tag,Equipment,Job,Sector,Priority,Est,Status', ...held.map(o => [byTag(o.tag)?.unit, o.no, o.tag, byTag(o.tag)?.name, o.desc, o.sectors.join('+'), o.priority, o.est || '', o.status].map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(','))].join('\n'); navigator.clipboard?.writeText(csv).then(() => toast('CSV copied to clipboard.')).catch(() => toast('Clipboard blocked here; select the table and copy instead.')); };
}

/* ===================== PM schedule ===================== */
let pmf = 'all';
function rPM() {
  const rows = pmRows().filter(r => pmf === 'all' || r.state === pmf || (pmf === 'due' && r.state === 'overdue'));
  const cnt = s => pmRows().filter(r => r.state === s).length;
  $('#view').innerHTML = `<div class="grid kpis" style="margin-bottom:14px"><div class="card kpi ${cnt('overdue') ? 'crit' : ''}"><div class="v num">${cnt('overdue')}</div><div class="k">Overdue this month</div></div><div class="card kpi warn"><div class="v num">${cnt('due')}</div><div class="k">Due within 7 days</div></div><div class="card kpi"><div class="v num">${cnt('raised')}</div><div class="k">PMO raised, in progress</div></div><div class="card kpi good"><div class="v num">${cnt('done')}</div><div class="k">Done this month</div></div><div class="card kpi"><div class="v num">${pmRows().length}</div><div class="k">Pumps on the calendar</div></div></div>
    <div class="toolbar"><div class="chips">${[['all', 'All'], ['due', 'Overdue and due'], ['raised', 'Raised'], ['done', 'Done'], ['later', 'Later']].map(([v, l]) => `<button data-f="${v}" aria-pressed="${pmf === v}">${l}</button>`).join('')}</div><span class="sp"></span><span class="muted">Schedule imported from "pump monthly and annual inspection" sheet</span></div>
    <div class="tablew"><table><thead><tr><th>Tag</th><th>Equipment</th><th>Unit</th><th>Calendar</th><th>Type</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${r.p.tag}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.unit)}</td><td class="muted">${r.c.day}, week ${r.c.week}${r.c.six.length ? ` · 6m in ${r.c.six.map(m => ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].at(m - 1)).join(', ')}` : ''}</td><td>${r.type}</td><td>${fmtD(r.due)}</td><td>${{ overdue: `<span class="pill crit">overdue ${-r.days} d</span>`, due: `<span class="pill warn">due in ${r.days} d</span>`, raised: `<span class="pill acc">PMO #${r.openPmo?.no}</span>`, done: '<span class="pill ok">done</span>', later: '<span class="pill">scheduled</span>' }[r.state]}</td><td>${r.state === 'raised' ? `<button class="btn ghost sm" data-open="${r.openPmo.no}">Open</button>` : r.state === 'done' ? '' : `<button class="btn sm" data-raise="${r.p.tag}" ${can('maint_mgr', 'proc_eng', 'mech_mgr') ? '' : 'disabled'}>Raise PMO now</button>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12px">In production the system raises each PMO automatically one day before the due date; the button simulates that. The next due date is counted from the actual completion date.</p>`;
  $('#view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { pmf = b.dataset.f; rPM(); });
  $('#view').querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('orders', +b.dataset.open));
  $('#view').querySelectorAll('[data-raise]').forEach(b => b.onclick = () => { const r = pmRows().find(x => x.p.tag === b.dataset.raise); const o = mk({ no: seqP++, type: 'PMO', pmType: r.type, tag: r.p.tag, desc: `${r.type} preventive maintenance: pump checklist (${PUMP_CHECKLIST.length} items).`, raisedBy: 'system', raisedAt: Date.now(), status: 'classified', sectors: ['Mechanical'], safetyClass: 'I', priority: 'Class 2', checklist: PUMP_CHECKLIST.map(c => ({ c, done: false })), sigs: [sig('system', Date.now(), 'PMO raised by schedule')] }); ORDERS.push(o); toast(`PMO #${o.no} raised for ${r.p.tag}. Process notified to switch to standby.`); go('orders', o.no); });
}

/* ===================== assets ===================== */
let afZone = 'all', afUnit = 'all', afQ = '';
function qrSvg(text, size) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return `<div style="font-size:10px;color:#333;text-align:center">${esc(text)}</div>`; } }
const LINK = t => `https://maint.albaha.example/eq/${t}`;
function rAssets() {
  if (sub) return rAsset(sub);
  const units = [...new Set(PUMPS.map(p => p.unit))].sort();
  const list = PUMPS.filter(p => afZone === 'all' || p.zone === +afZone).filter(p => afUnit === 'all' || p.unit === afUnit).filter(p => !afQ || (p.name + ' ' + p.tag).toLowerCase().includes(afQ.toLowerCase()));
  $('#view').innerHTML = `<div class="toolbar"><input type="search" id="q" placeholder="Search name or tag" value="${esc(afQ)}"><select id="z"><option value="all">All zones</option>${[1, 2, 3, 4, 5, 6].map(z => `<option value="${z}">Zone ${z}</option>`).join('')}</select><select id="u"><option value="all">All units</option>${units.map(u => `<option>${esc(u)}</option>`).join('')}</select><span class="sp"></span><span class="muted">${list.length} of ${PUMPS.length} pumps · ${PUMPS.filter(p => p.untagged).length} without a tag yet</span></div>
    <div class="tablew"><table><thead><tr><th>Tag</th><th>Equipment</th><th>Zone</th><th>Unit</th><th>Motor</th><th>Status</th><th>Open orders</th><th>Next PM</th></tr></thead><tbody>${list.map(p => { const oo = ORDERS.filter(o => o.tag === p.tag && o.status !== 'closed').length; const r = pmRows().find(x => x.p === p); return `<tr class="click" data-tag="${p.tag}"><td class="mono">${p.tag}${p.untagged ? ' <span class="tag">provisional</span>' : ''}</td><td><b>${esc(p.name)}</b>${p.remark ? `<br><span class="muted" style="font-size:12px">${esc(p.remark)}</span>` : ''}</td><td class="num">${p.zone}</td><td>${esc(p.unit)}</td><td class="muted">${p.kw ? p.kw + ' kW' : '—'}${p.rpm ? ' · ' + p.rpm + ' rpm' : ''}</td><td>${epill(p.status)}</td><td class="num">${oo || '<span class="muted">0</span>'}</td><td>${r ? (r.state === 'overdue' ? '<span class="pill crit">overdue</span>' : fmtD(r.due)) : '<span class="muted">not on calendar</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
  $('#q').oninput = e => { afQ = e.target.value; rAssets(); $('#q').focus(); $('#q').setSelectionRange(afQ.length, afQ.length); }; $('#z').value = afZone; $('#u').value = afUnit; $('#z').onchange = e => { afZone = e.target.value; rAssets(); }; $('#u').onchange = e => { afUnit = e.target.value; rAssets(); };
  $('#view').querySelectorAll('tr[data-tag]').forEach(r => r.addEventListener('click', () => go('assets', r.dataset.tag)));
}
function rAsset(tag, fromScan) {
  const p = byTag(tag); if (!p) return go('assets');
  const hist = ORDERS.filter(o => o.tag === tag).sort((a, b) => b.raisedAt - a.raisedAt); const r = pmRows().find(x => x.p === p);
  const canReport = true; // anyone who scans the QR can raise a report; the Process Engineer classifies it
  $('#view').innerHTML = `<button class="btn ghost sm" id="back">← ${fromScan ? 'Scan another' : 'Assets'}</button>
    <div class="card" style="margin-top:12px"><div class="asset-head"><div class="qr">${qrSvg(LINK(tag))}</div><div style="flex:1;min-width:220px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono muted">${tag}</span>${epill(p.status)}${p.untagged ? '<span class="tag">provisional tag</span>' : ''}</div><h2 style="font-size:20px;margin:4px 0 8px">${esc(p.name)}</h2>
      <dl class="dl"><dt>Unit / zone</dt><dd>${esc(p.unit)}, zone ${p.zone}</dd><dt>Class</dt><dd>Pump</dd><dt>Motor</dt><dd>${p.kw ? p.kw + ' kW' : 'unknown'}${p.rpm ? ', ' + p.rpm + ' rpm' : ''} · rigid mounting</dd><dt>Bearing temp.</dt><dd>alert 70 °C · danger 80 °C</dd>${p.remark ? `<dt>Remark</dt><dd>${esc(p.remark)}</dd>` : ''}<dt>Next PM</dt><dd>${r ? `${r.type}, ${fmtD(r.due)} (${r.c.day}, week ${r.c.week})` : 'not on the inspection calendar'}</dd></dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn danger" id="rep" ${canReport ? '' : 'disabled'} title="${canReport ? '' : 'Process department raises problems'}">Report a problem</button><button class="btn ghost" id="lbl">QR label</button>${can('proc_eng') ? `<button class="btn ghost" id="tog">Set ${p.status === 'Online' ? 'Offline' : 'Online'}</button>` : ''}</div>${canReport ? '' : '<p class="muted" style="font-size:12px;margin:6px 0 0">Switch to a Process role to report a problem.</p>'}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>History <span>${hist.length} orders</span></h3>${hist.length ? `<div class="hist">${hist.map(o => `<div class="it"><span class="mono">${o.type} ${o.no}</span><span>${esc(o.desc)}<br><span class="muted">${o.sectors.join(', ')} · ${fmt(o.raisedAt)}${o.downtime ? ` · downtime ${o.downtime} h` : ''}</span></span><span>${pill(o.status)} <button class="btn ghost sm" data-open="${o.no}">Open</button></span></div>`).join('')}</div>` : '<p class="empty">No orders recorded yet.</p>'}</div>
    <div id="repform"></div>`;
  $('#back').onclick = () => fromScan ? go('scan') : go('assets');
  $('#view').querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('orders', +b.dataset.open));
  $('#lbl').onclick = () => { $('#modal').innerHTML = `<div class="modal" id="mod"><div class="box" style="max-width:360px;text-align:center"><div class="label-print">${qrSvg(LINK(tag))}<b>${tag}</b><small>${esc(p.name)}<br>${esc(p.unit)} · Zone ${p.zone}</small><small style="font-family:var(--f-mono);font-size:9px">${LINK(tag)}</small></div><p class="muted" style="font-size:12px">Printed on chemical-resistant vinyl, 60 × 80 mm.</p><button class="btn ghost sm" id="close">Close</button></div></div>`; $('#close').onclick = () => $('#modal').innerHTML = ''; };
  if ($('#tog')) $('#tog').onclick = () => { p.status = p.status === 'Online' ? 'Offline' : 'Online'; toast(`${tag} set ${p.status}.`); rAsset(tag, fromScan); };
  if ($('#rep')) $('#rep').onclick = () => {
    $('#repform').innerHTML = `<div class="card action" style="margin-top:14px"><h3>Report a problem on ${tag} <span>${esc(ME().pos)}</span></h3><div class="field"><label for="d">What is wrong?</label><textarea id="d" placeholder="e.g. Unusual noise from the bearing side, pump still running"></textarea></div><div class="photo"><input type="file" id="ph" accept="image/*" multiple><label for="ph">+ Add photo or video</label><span id="phc">0 attached</span></div><label class="check" style="margin-top:8px"><input type="checkbox" id="stop"> Equipment is stopped</label><p class="err" id="rerr" hidden></p><button class="btn danger" id="send">Send report to Process Engineer</button></div>`;
    const photos = []; $('#ph').onchange = e => [...e.target.files].slice(0, 4).forEach(f => { const rd = new FileReader(); rd.onload = () => { photos.push(rd.result); $('#phc').textContent = photos.length + ' attached'; }; rd.readAsDataURL(f); });
    $('#send').onclick = () => { const d = $('#d').value.trim(); if (d.length < 5) { $('#rerr').textContent = 'Describe the problem in a few words.'; $('#rerr').hidden = false; return; } const o = mk({ no: seqC++, tag, desc: d, raisedBy: me, raisedAt: Date.now(), status: 'reported', photos, sigs: [sig(me, Date.now(), 'Reported')] }); if ($('#stop').checked) p.status = 'Offline'; ORDERS.push(o); toast(`CMO #${o.no} reported. Process Engineer notified.`); go('orders', o.no); };
    $('#repform').scrollIntoView({ behavior: 'smooth' });
  };
}

/* ===================== scan ===================== */
function rScan() {
  if (sub) return rAsset(sub, true);
  const sample = ['23P001A', '07P001A', '27P003A', '76P004A', '02P001A', '17P001A', '24P1101B', '74P002A'];
  $('#view').innerHTML = `<div class="grid scan"><div><div class="viewfinder"><div class="frame"><i></i><i></i><i></i><i></i></div><div class="line"></div><p>Point the phone camera at the equipment label</p></div><p class="muted" style="font-size:12.5px;margin:0">The camera is not used in this demo. Pick a label below to simulate the scan; in production the QR holds the link <span class="mono">maint.albaha.example/eq/&lt;tag&gt;</span> and opens in any phone browser.</p></div>
    <div class="card"><h3>Labels in reach <span>simulated</span></h3><div class="hist">${sample.map(t => { const p = byTag(t); return `<div class="it"><span class="mono">${t}</span><span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.unit)}, zone ${p.zone}</span></span><span>${epill(p.status)} <button class="btn sm" data-scan="${t}">Scan</button></span></div>`; }).join('')}</div></div></div>`;
  $('#view').querySelectorAll('[data-scan]').forEach(b => b.onclick = () => go('scan', b.dataset.scan));
}

/* ===================== boot ===================== */
$('#who').innerHTML = USERS.map(u => `<option value="${u.id}">${u.name} · ${u.pos}</option>`).join('');
$('#who').value = me;
$('#who').onchange = e => { me = e.target.value; $('#avatar').textContent = ME().name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase(); render(); };
$('#avatar').textContent = ME().name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
document.querySelectorAll('nav.side a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.v); }));
try { const h = location.hash.slice(1); if (VIEWS[h]) view = h; } catch (e) {}
render();
</script>
