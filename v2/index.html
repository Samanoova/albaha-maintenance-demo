/* Layout: fixed left nav (collapses to a top strip on phones), top bar with "acting as" role switch, one view at a time */
:root {
  --bg: #f0f4f7; --surface: #ffffff; --sunken: #f6f8fa; --ink: #12232f; --muted: #5f6d69; --line: #d6dee5;
  --accent: #00857e; --accent-soft: #d8f3f1; --on-accent: #ffffff; --nav: #12232f; --nav-ink: #8ea4ba; --nav-active: #1a4047; --brand-teal: #00bbb3;
  --good: #1b7f4b; --good-soft: #dcf3e5; --warn: #a66a00; --warn-soft: #fbefd4; --crit: #b9312b; --crit-soft: #fae1df;
  --mech: #2a78d6; --elec: #eb6834; --inst: #1baf7a;
  --f-body: "Montserrat", "Segoe UI", system-ui, sans-serif; --f-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c171e; --surface: #12232f; --sunken: #0f1d27; --ink: #e4ecf1; --muted: #93a6b5; --line: #24394a;
  --accent: #2fd0c6; --accent-soft: #0f3a3c; --on-accent: #062a28; --nav: #08121a; --nav-ink: #8ea4ba; --nav-active: #15404a; --brand-teal: #00bbb3;
  --good: #5fcf8e; --good-soft: #143322; --warn: #e5b14f; --warn-soft: #362a10; --crit: #f0776d; --crit-soft: #3b1a17;
  --mech: #3987e5; --elec: #d95926; --inst: #199e70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c171e; --surface: #12232f; --sunken: #0f1d27; --ink: #e4ecf1; --muted: #93a6b5; --line: #24394a;
  --accent: #2fd0c6; --accent-soft: #0f3a3c; --on-accent: #062a28; --nav: #08121a; --nav-ink: #8ea4ba; --nav-active: #15404a; --brand-teal: #00bbb3;
  --good: #5fcf8e; --good-soft: #143322; --warn: #e5b14f; --warn-soft: #362a10; --crit: #f0776d; --crit-soft: #3b1a17;
  --mech: #3987e5; --elec: #d95926; --inst: #199e70; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
nav.side { background: var(--nav); color: var(--nav-ink); padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { color: #fff; font-weight: 700; font-size: 15px; line-height: 1.2; margin-bottom: 4px; }
.brand small { display: block; font-weight: 400; color: var(--nav-ink); font-size: 11px; margin-top: 2px; }
.demo-tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-teal); margin-bottom: 14px; }
.brand-logo { background: #fff; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: center; align-self: stretch; margin: 0 0 12px; box-shadow: 0 1px 0 rgba(0,0,0,.08); } .brand-logo img { height: 72px; width: auto; display: block; image-rendering: auto; }
nav.side a { color: inherit; text-decoration: none; padding: 9px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 500; }
nav.side a[aria-current="page"] { background: var(--nav-active); color: #fff; box-shadow: inset 3px 0 0 var(--brand-teal); }
nav.side a .badge { background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
main { padding-block: 16px 48px; padding-left: 24px; padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 18px; }
.topbar h1 { font-size: 20px; }
.acting { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.acting label { font-size: 12px; color: var(--muted); }
.acting select { border: 0; background: transparent; font-weight: 600; max-width: 260px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi .v { font-size: 26px; font-weight: 700; line-height: 1.15; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .d { font-size: 12px; margin-top: 4px; }
.kpi.crit .v { color: var(--crit); } .kpi.warn .v { color: var(--warn); } .kpi.good .v { color: var(--good); }
.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.card h3 { font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 span { font-weight: 400; color: var(--muted); font-size: 12px; }

/* ===================== PM schedule ===================== */
const DAYS = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thr: 4, Thu: 4, Fri: 5, Sat: 6 };
function pmDate(c, y, m) { const d = new Date(y, m, 1 + (c.week - 1) * 7); while (d.getDay() !== DAYS[c.day]) d.setDate(d.getDate() + 1); return d; }
function pmRows() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(); const out = [];
  PUMPS.forEach((p, i) => {
    const c = CAL[p.tag]; if (!c) return;
    let due = pmDate(c, y, m), month = m;
    // demo: tasks whose date has passed count as done, except every 6th pump, which is left overdue
    const done = PM_DONE[p.tag] || (due < now - D && i % 6 !== 0) || ORDERS.some(o => o.type === 'PMO' && o.tag === p.tag && o.status === 'closed' && o.closedAt > new Date(y, m, 1));
    if (done) { due = pmDate(c, y, m + 1); month = m + 1; }
    const openPmo = ORDERS.find(o => o.type === 'PMO' && o.tag === p.tag && !isDone(o));
    const left = (due - now) / D;
    const state = openPmo ? 'raised' : done ? 'done' : left < 0 ? 'overdue' : left <= 7 ? 'due' : 'later';
    out.push({ p, c, due, type: c.six.includes(((month % 12) + 12) % 12 + 1) ? 'Six-monthly' : 'Monthly', state, openPmo, days: Math.round(left) });
  });
  return out.sort((a, b) => a.due - b.due);
}

      <span class="hb-v num">${fmtv(r.v + (r.v2 || 0))}</span></div>`; }).join('')}</div>`;

function lineChart(labels, series, o = {}) {
  const W = 560, H = 200, L = 30, R = 64, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
  const mx = Math.ceil(Math.max(...series.flatMap(s => s.d)) / 4) * 4 || 4;
  const x = i => L + i * iw / (labels.length - 1), y = v => T + ih - v / mx * ih;
  const grid = [0, mx / 2, mx].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`).join('');
  const xl = labels.map((l, i) => i % 2 === labels.length % 2 ? '' : `<text x="${x(i)}" y="${H - 6}" class="ax" text-anchor="middle">${l}</text>`).join('');
  const paths = series.map(s => `<path d="${s.d.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}" fill="none" stroke="${s.c}" stroke-width="2"${s.dash ? ' stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(s.d.length - 1)}" cy="${y(s.d[s.d.length - 1])}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const ends = series.map((s, k) => { const v = s.d[s.d.length - 1]; const yy = y(v) + (k ? 12 : -4); return `<text x="${W - R + 8}" y="${yy}" class="lb">${s.n} ${v}</text>`; }).join('');
  const hits = labels.map((l, i) => `<g class="hit" data-tip="Week of ${l}: ${series.map(s => `${s.n.toLowerCase()} ${s.d[i]}`).join(', ')}"><rect x="${x(i) - iw / (labels.length - 1) / 2}" y="${T}" width="${iw / (labels.length - 1)}" height="${ih}" fill="transparent"/><line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + ih}" class="xh"/></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="lc" role="img" aria-label="${esc(o.label || '')}">${grid}${xl}${paths}${ends}${hits}</svg>`;
}

  const rows = pmRows().filter(r => pmf === 'all' || r.state === pmf || (pmf === 'due' && r.state === 'overdue'));
  const cnt = s => pmRows().filter(r => r.state === s).length;
  $('#view').innerHTML = `<div class="grid kpis" style="margin-bottom:14px"><div class="card kpi ${cnt('overdue') ? 'crit' : ''}"><div class="v num">${cnt('overdue')}</div><div class="k">Overdue this month</div></div><div class="card kpi warn"><div class="v num">${cnt('due')}</div><div class="k">Due within 7 days</div></div><div class="card kpi"><div class="v num">${cnt('raised')}</div><div class="k">PMO raised, in progress</div></div><div class="card kpi good"><div class="v num">${cnt('done')}</div><div class="k">Done this month</div></div><div class="card kpi"><div class="v num">${pmRows().length}</div><div class="k">Pumps on the calendar</div></div></div>
    <div class="toolbar"><div class="chips">${[['all', 'All'], ['due', 'Overdue and due'], ['raised', 'Raised'], ['done', 'Done'], ['later', 'Later']].map(([v, l]) => `<button data-f="${v}" aria-pressed="${pmf === v}">${l}</button>`).join('')}</div><span class="sp"></span><span class="muted">Schedule imported from "pump monthly and annual inspection" sheet</span></div>
    <div class="tablew"><table><thead><tr><th>Tag</th><th>Equipment</th><th>Unit</th><th>Calendar</th><th>Type</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td class="mono">${r.p.tag}</td><td>${esc(r.p.name)}</td><td>${esc(r.p.unit)}</td><td class="muted">${r.c.day}, week ${r.c.week}${r.c.six.length ? ` · 6m in ${r.c.six.map(m => ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].at(m - 1)).join(', ')}` : ''}</td><td>${r.type}</td><td>${fmtD(r.due)}</td><td>${{ overdue: `<span class="pill crit">overdue ${-r.days} d</span>`, due: `<span class="pill warn">due in ${r.days} d</span>`, raised: `<span class="pill acc">PMO #${r.openPmo?.no}</span>`, done: '<span class="pill ok">done</span>', later: '<span class="pill">scheduled</span>' }[r.state]}</td><td>${r.state === 'raised' ? `<button class="btn ghost sm" data-open="${r.openPmo.no}">Open</button>` : r.state === 'done' ? '' : `<button class="btn sm" data-raise="${r.p.tag}" ${can('maint_mgr', 'proc_eng', 'mech_mgr') ? '' : 'disabled'}>Raise PMO now</button>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12px">In production the system raises each PMO automatically one day before the due date; the button simulates that. The next due date is counted from the actual completion date.</p>`;
  $('#view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { pmf = b.dataset.f; rPM(); });
  $('#view').querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('orders', +b.dataset.open));
  $('#view').querySelectorAll('[data-raise]').forEach(b => b.onclick = () => { const r = pmRows().find(x => x.p.tag === b.dataset.raise); const o = mk({ no: seqP++, type: 'PMO', pmType: r.type, tag: r.p.tag, desc: `${r.type} preventive maintenance: pump checklist (${PUMP_CHECKLIST.length} items).`, raisedBy: 'system', raisedAt: Date.now(), status: 'classified', sectors: ['Mechanical'], safetyClass: 'I', priority: 'Class 2', checklist: PUMP_CHECKLIST.map(c => ({ c, done: false })), sigs: [sig('system', Date.now(), 'PMO raised by schedule')] }); ORDERS.push(o); toast(`PMO #${o.no} raised for ${r.p.tag}. Process notified to switch to standby.`); go('orders', o.no); });
}

/* ===================== assets ===================== */
let afZone = 'all', afUnit = 'all', afQ = '';
const ZONES = [...new Set(PUMPS.map(p => p.zone))].sort((a, b) => a - b).map(z => [z, [...new Set(PUMPS.filter(p => p.zone === z).map(p => p.unit))]]);
function qrSvg(text, size) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return `<div style="font-size:10px;color:#333;text-align:center">${esc(text)}</div>`; } }
const LINK = t => `https://maint.albaha.example/eq/${t}`;
function rAssets() {
  if (sub) return rAsset(sub);
  const units = [...new Set(PUMPS.map(p => p.unit))].sort();
  const list = PUMPS.filter(p => afZone === 'all' || p.zone === +afZone).filter(p => afUnit === 'all' || p.unit === afUnit).filter(p => !afQ || (p.name + ' ' + p.tag).toLowerCase().includes(afQ.toLowerCase()));
  $('#view').innerHTML = `<div class="toolbar"><input type="search" id="q" placeholder="Search name or tag" value="${esc(afQ)}"><select id="z" aria-label="Zone"><option value="all">All zones</option>${ZONES.map(([z, us]) => `<option value="${z}">${esc(us.join(', '))}</option>`).join('')}</select><select id="u"><option value="all">All units</option>${units.map(u => `<option>${esc(u)}</option>`).join('')}</select><span class="sp"></span><span class="muted">${list.length} of ${PUMPS.length} pumps · ${PUMPS.filter(p => p.untagged).length} without a tag yet</span></div>
    <div class="tablew"><table><thead><tr><th>Tag</th><th>Equipment</th><th>Zone</th><th>Unit</th><th>Motor</th><th>Status</th><th>Open orders</th><th>Next PM</th></tr></thead><tbody>${list.map(p => { const oo = ORDERS.filter(o => o.tag === p.tag && !isDone(o)).length; const r = pmRows().find(x => x.p === p); return `<tr class="click" data-tag="${p.tag}"><td class="mono">${p.tag}${p.untagged ? ' <span class="tag">provisional</span>' : ''}</td><td><b>${esc(p.name)}</b>${p.remark ? `<br><span class="muted" style="font-size:12px">${esc(p.remark)}</span>` : ''}</td><td class="num">${p.zone}</td><td>${esc(p.unit)}</td><td class="muted">${p.kw ? p.kw + ' kW' : '—'}${p.rpm ? ' · ' + p.rpm + ' rpm' : ''}</td><td>${epill(p.status)}</td><td class="num">${oo || '<span class="muted">0</span>'}</td><td>${r ? (r.state === 'overdue' ? '<span class="pill crit">overdue</span>' : fmtD(r.due)) : '<span class="muted">not on calendar</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
  $('#q').oninput = e => { afQ = e.target.value; rAssets(); $('#q').focus(); $('#q').setSelectionRange(afQ.length, afQ.length); }; $('#z').value = afZone; $('#u').value = afUnit; $('#z').onchange = e => { afZone = e.target.value; rAssets(); }; $('#u').onchange = e => { afUnit = e.target.value; rAssets(); };
  $('#view').querySelectorAll('tr[data-tag]').forEach(r => r.addEventListener('click', () => go('assets', r.dataset.tag)));
}
function rAsset(tag, fromScan) {
  const p = byTag(tag); if (!p) return go('assets');
  const hist = ORDERS.filter(o => o.tag === tag).sort((a, b) => b.raisedAt - a.raisedAt); const r = pmRows().find(x => x.p === p);
  const canReport = true; // anyone who scans the QR can raise a report; the Process Engineer classifies it
  $('#view').innerHTML = `<button class="btn ghost sm" id="back">← ${fromScan ? 'Scan another' : 'Assets'}</button>
    <div class="card" style="margin-top:12px"><div class="asset-head"><div class="qr">${qrSvg(LINK(tag))}</div><div style="flex:1;min-width:220px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono muted">${tag}</span>${epill(p.status)}${p.untagged ? '<span class="tag">provisional tag</span>' : ''}</div><h2 style="font-size:20px;margin:4px 0 8px">${esc(p.name)}</h2>
      <dl class="dl"><dt>Unit / zone</dt><dd>${esc(p.unit)}, zone ${p.zone}</dd><dt>Class</dt><dd>Pump</dd><dt>Motor</dt><dd>${p.kw ? p.kw + ' kW' : 'unknown'}${p.rpm ? ', ' + p.rpm + ' rpm' : ''} · rigid mounting</dd><dt>Bearing temp.</dt><dd>alert 70 °C · danger 80 °C</dd>${p.remark ? `<dt>Remark</dt><dd>${esc(p.remark)}</dd>` : ''}<dt>Next PM</dt><dd>${r ? `${r.type}, ${fmtD(r.due)} (${r.c.day}, week ${r.c.week})` : 'not on the inspection calendar'}</dd></dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn danger" id="rep" ${canReport ? '' : 'disabled'} title="${canReport ? '' : 'Process department raises problems'}">Report a problem</button><button class="btn ghost" id="lbl">QR label</button>${can(...MOC_ISSUERS) ? '<button class="btn ghost" id="moc">Replacement order (MOC)</button>' : ''}${can('proc_eng') ? `<button class="btn ghost" id="tog">Set ${p.status === 'Online' ? 'Offline' : 'Online'}</button>` : ''}</div>${canReport ? '' : '<p class="muted" style="font-size:12px;margin:6px 0 0">Switch to a Process role to report a problem.</p>'}</div></div></div>
    <div class="card" style="margin-top:14px"><h3>History <span>${hist.length} orders</span></h3>${hist.length ? `<div class="hist">${hist.map(o => `<div class="it"><span class="mono">${o.type} ${o.no}</span><span>${esc(o.desc)}<br><span class="muted">${o.sectors.join(', ')} · ${fmt(o.raisedAt)}${o.downtime ? ` · downtime ${o.downtime} h` : ''}</span></span><span>${pill(o.status)} <button class="btn ghost sm" data-open="${o.no}">Open</button></span></div>`).join('')}</div>` : '<p class="empty">No orders recorded yet.</p>'}</div>
    <div id="repform"></div>`;
  $('#back').onclick = () => fromScan ? go('scan') : go('assets');
  $('#view').querySelectorAll('[data-open]').forEach(b => b.onclick = () => go('orders', +b.dataset.open));
  $('#lbl').onclick = () => { $('#modal').innerHTML = `<div class="modal" id="mod"><div class="box" style="max-width:360px;text-align:center"><div class="label-print">${qrSvg(LINK(tag))}<b>${tag}</b><small>${esc(p.name)}<br>${esc(p.unit)} · Zone ${p.zone}</small><small style="font-family:var(--f-mono);font-size:9px">${LINK(tag)}</small></div><p class="muted" style="font-size:12px">Printed on chemical-resistant vinyl, 60 × 80 mm.</p><button class="btn ghost sm" id="close">Close</button></div></div>`; $('#close').onclick = () => $('#modal').innerHTML = ''; };
  if ($('#moc')) $('#moc').onclick = () => openMocForm($('#repform'), tag);
  if ($('#tog')) $('#tog').onclick = () => { p.status = p.status === 'Online' ? 'Offline' : 'Online'; toast(`${tag} set ${p.status}.`); rAsset(tag, fromScan); };
  if ($('#rep')) $('#rep').onclick = () => {
    const direct = ['proc_eng', 'proc_sup', 'proc_mgr', 'gm'].includes(me); const approver = me !== 'proc_eng';
    const extra = direct ? `<p class="muted" style="font-size:12px;margin:8px 0 4px">${approver ? 'You fill the work order directly: it opens and goes to the Maintenance Manager without the Process Engineer step.' : 'You fill the work order now; it goes to the Process Supervisor for approval.'}</p>
      <div class="field"><span class="label">Department To</span>${ckGroup('rdto', SECTORS, 'checkbox')}</div>
      <div class="field"><label for="rtct">Tentative Comp. Time (Hrs.)</label><input type="text" id="rtct" inputmode="decimal" placeholder="e.g. 4"></div>
      <div class="field"><span class="label">Nature Of Job</span>${ckGroup('rnat', ['Urgent', 'un Urgent', 'Normal'], 'radio', 'Normal')}</div>
      <div class="field"><span class="label">Category Of Safety Clearance</span>${ckGroup('rcls', ['Class I', 'Class II'], 'radio', 'Class I')}</div>` : '';
    $('#repform').innerHTML = `<div class="card action" style="margin-top:14px"><h3>Report a problem on ${tag} <span>${esc(ME().pos)}</span></h3><div class="field"><label for="d">${direct ? 'Description of Job' : 'What is wrong?'}</label><textarea id="d" placeholder="e.g. Unusual noise from the bearing side, pump still running"></textarea></div><div class="photo"><input type="file" id="ph" accept="image/*" multiple><label for="ph">+ Add photo or video</label><span id="phc">0 attached</span></div><label class="check" style="margin-top:8px"><input type="checkbox" id="stop"> Equipment is stopped</label>${extra}${signBlock()}<button class="btn danger" id="send">${direct ? (approver ? 'Submit and open ticket' : 'Submit report and sign') : 'Send report to Process Engineer'}</button></div>`;
    const photos = []; $('#ph').onchange = e => [...e.target.files].slice(0, 4).forEach(f => { const rd = new FileReader(); rd.onload = () => { photos.push(rd.result); $('#phc').textContent = photos.length + ' attached'; }; rd.readAsDataURL(f); });
    $('#send').onclick = () => {
      const d = $('#d').value.trim(); const er = $('#aerr');
      if (d.length < 5) { er.textContent = 'Describe the problem in a few words.'; er.hidden = false; return; }
      if (direct && !rvs('rdto').length) { er.textContent = 'Tick at least one department under Department To.'; er.hidden = false; return; }
      const t = Date.now(); const sigs = [sig(me, t, 'Reported')];
      const o = mk(Object.assign({ no: seqC++, tag, desc: d, raisedBy: me, raisedAt: t, status: 'reported', photos, sigs }, direct ? { sectors: rvs('rdto'), nature: rv('rnat'), safetyClass: rv('rcls') === 'Class II' ? 'II' : 'I', priority: rv('rnat') === 'Urgent' ? 'Class 1' : 'Class 2', shutdown: false, est: $('#rtct').value ? $('#rtct').value + ' hrs' : '' } : {}));
      if (direct) { sigs.push(sig(me, t, 'Report submitted')); o.status = 'classified'; if (approver) { sigs.push(sig(me, t, 'Report approved')); o.status = 'open'; } if (o.priority === 'Class 1') p.status = 'Offline'; }
      if ($('#stop').checked) p.status = 'Offline'; ORDERS.push(o);
      toast(direct ? (approver ? `CMO #${o.no} opened and sent to the Maintenance Manager.` : `CMO #${o.no} reported; waits for Process Supervisor approval.`) : `CMO #${o.no} reported. Process Engineer notified.`); go('orders', o.no);
    };
    $('#repform').scrollIntoView({ behavior: 'smooth' });
  };
}

/* ===================== scan ===================== */
let scQ = '', scUnit = 'all', scStatus = 'all', scOpen = false;
function rScan() {
  if (sub) return rAsset(sub, true);
  const units = [...new Set(PUMPS.slice().sort((a, b) => a.zone - b.zone).map(p => p.unit))];
  $('#view').innerHTML = `<div class="grid scan"><div><div class="viewfinder"><div class="frame"><i></i><i></i><i></i><i></i></div><div class="line"></div><p>Point the phone camera at the equipment label</p></div><p class="muted" style="font-size:12.5px;margin:0">The camera is not used in this demo. Pick equipment from the list to simulate the scan; in production the QR holds the link <span class="mono">maint.albaha.example/eq/&lt;tag&gt;</span> and opens in any phone browser.</p></div>
    <div class="card"><h3>Equipment <span id="sccount"></span></h3>
      <div class="toolbar sc-tools"><input type="search" id="scq" placeholder="Search tag or name" value="${esc(scQ)}" aria-label="Search tag or name">
        <select id="scs" aria-label="Status"><option value="all">Any status</option><option>Online</option><option>Offline</option><option>Isolated</option></select>
        <label class="check sc-open"><input type="checkbox" id="sco"${scOpen ? ' checked' : ''}> Open orders only</label></div>
      <div class="chips sc-zones" id="scz"><button type="button" data-z="all" aria-pressed="${scUnit === 'all'}">All</button>${units.map(u => `<button type="button" data-z="${esc(u)}" aria-pressed="${scUnit === u}">${esc(u)}</button>`).join('')}</div>
      <div id="zl"></div></div></div>`;
  $('#scs').value = scStatus;
  const list = () => {
    const q = scQ.trim().toLowerCase();
    const hits = PUMPS.filter(p => (scUnit === 'all' || p.unit === scUnit) && (scStatus === 'all' || p.status === scStatus)
      && (!q || p.tag.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)) && (!scOpen || ORDERS.some(o => o.tag === p.tag && !isDone(o))));
    $('#sccount').textContent = `${hits.length} of ${PUMPS.length}`;
    const byU = {}; hits.forEach(p => (byU[p.unit] = byU[p.unit] || []).push(p));
    const keys = units.filter(u => byU[u]);
    $('#zl').innerHTML = keys.length ? keys.map(u => { const ps = byU[u];
      return `<section class="zone"><div class="zh"><b>${esc(u)}</b><span class="zc num">${ps.length}</span></div>
        <div class="hist">${ps.map(p => { const oo = ORDERS.filter(o => o.tag === p.tag && !isDone(o)).length; return `<div class="it"><span class="mono">${p.tag}</span><span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.unit)}${oo ? ` · <span style="color:var(--crit)">${oo} open order${oo > 1 ? 's' : ''}</span>` : ''}</span></span><span>${epill(p.status)} <button class="btn sm" data-scan="${p.tag}">Scan</button></span></div>`; }).join('')}</div></section>`; }).join('')
      : '<p class="empty">No equipment matches these filters.</p>';
    $('#zl').querySelectorAll('[data-scan]').forEach(b => b.onclick = () => go('scan', b.dataset.scan));
  };
  $('#scq').oninput = e => { scQ = e.target.value; list(); };
  $('#scs').onchange = e => { scStatus = e.target.value; list(); };
  $('#sco').onchange = e => { scOpen = e.target.checked; list(); };
  $('#scz').querySelectorAll('button').forEach(b => b.onclick = () => { scUnit = b.dataset.z; $('#scz').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); list(); });
  list();
}

/* ===================== boot ===================== */
$('#who').innerHTML = USERS.map(u => `<option value="${u.id}">${u.name} · ${u.pos}</option>`).join('');
$('#who').value = me;
$('#who').onchange = e => { me = e.target.value; $('#avatar').textContent = ME().name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase(); render(); };
$('#avatar').textContent = ME().name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
document.querySelectorAll('nav.side a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.v); }));
try { const h = location.hash.slice(1); if (VIEWS[h]) view = h; } catch (e) {}
render();
</script>
